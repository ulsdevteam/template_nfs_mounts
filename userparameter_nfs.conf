# Install as /etc/zabbix/zabbix_agentd.d/userparameter_nfs.conf (or your Include= directory).
# Set Timeout=10 in zabbix_agentd.conf; the default of 3s is shorter than the checks below.

UserParameter=nfs.discovery,/usr/local/bin/nfs_discovery.sh
UserParameter=nfs.mount.stat[*],/usr/local/bin/nfs_mount_stat.sh "$1" "$2"

# stat on the mount point. 0 = OK, 124/137 = hung (timeout fired), 1/2 = missing or stale handle.
UserParameter=nfs.mount.check[*],timeout -k 1 4 stat -t "$1" >/dev/null 2>&1; echo $?

# 1 = server answers rpcinfo for the NFS program (100003), 0 = it does not.
# $2 (the mount point) is accepted but unused; it keeps item keys unique per mount in the template.
UserParameter=nfs.server.check[*],timeout 4 /usr/sbin/rpcinfo -t "$1" 100003 >/dev/null 2>&1 && echo 1 || echo 0

# Alternative for servers that do not answer rpcinfo (checks TCP 2049, the NFSv4 port):
#UserParameter=nfs.server.check[*],timeout 4 bash -c '</dev/tcp/$1/2049' >/dev/null 2>&1 && echo 1 || echo 0
